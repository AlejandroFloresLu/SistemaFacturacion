<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACTU - Productos</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"> 
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/auth-guard.js"></script>
</head>
<body>

    <div id="topbar-placeholder"></div>
    <div id="sidebar-placeholder"></div>
    <div id="a11y-placeholder"></div>

    <main class="main-content p-4 bg-light" style="min-height: 100vh;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0 text-dark"><i data-lucide="package" class="me-2 text-primary"></i>Inventario Comercial</h2>
                <p class="text-muted mt-1 mb-0">Gestión de boletos, tours y paquetes turísticos.</p>
            </div>
            <div>
                <button class="btn btn-factu shadow-sm" data-bs-toggle="modal" data-bs-target="#modalNuevoProducto"><i data-lucide="plus" class="me-1"></i> Añadir Producto</button>
            </div>
        </div>
        
        <div class="card shadow-sm border-0" style="border-radius: var(--border-radius);">
            <div class="card-header border-0 pt-4 pb-3 d-flex gap-2 align-items-center flex-column flex-sm-row">
                <div class="input-group flex-grow-1">
                    <span class="input-group-text bg-light border-0"><i data-lucide="search" class="text-muted" aria-hidden="true"></i></span>
                    <input type="text" class="form-control bg-light border-0 shadow-none" id="productoSearch" placeholder="Buscar por código o descripción..." oninput="filtrarProductos()" aria-label="Buscar producto">
                </div>
                <select id="filtroCategoria" class="form-select border-1 bg-light text-muted w-100" style="max-width: 250px;" onchange="filtrarProductos()">
                    <option value="ALL">Todas las Categorías</option>
                    <!-- Dinámico -->
                </select>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="bg-light text-muted" style="font-size:.78rem;letter-spacing:.4px;">
                        <tr>
                            <th class="ps-4">Código</th>
                            <th>Descripción / Producto</th>
                            <th class="text-end">Precio</th>
                            <th class="text-end pe-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="productosBody">
                        <!-- El JS llenará esto -->
                    </tbody>
                </table>
            </div>
            <div class="card-footer border-top p-3 d-flex justify-content-between align-items-center">
                <span class="text-muted small" id="productosContador">Mostrando 0 productos</span>
                <div class="d-flex gap-1">
                    <button class="btn btn-sm btn-light border" id="prodPrev" onclick="prodPagina(-1)" aria-label="Página anterior de productos">‹</button>
                    <span class="btn btn-sm btn-factu disabled px-3" id="prodPaginaNum">1</span>
                    <button class="btn btn-sm btn-light border" id="prodNext" onclick="prodPagina(1)" aria-label="Página siguiente de productos">›</button>
                </div>
            </div>
        </div>
        
        <!-- Modal Nuevo Producto -->
        <div class="modal fade" id="modalNuevoProducto" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg" style="border-radius: var(--border-radius);">
                    <div class="modal-header border-0 bg-white" style="border-radius: var(--border-radius) var(--border-radius) 0 0;">
                        <h5 class="modal-title fw-bold text-dark d-flex align-items-center"><i data-lucide="package-plus" class="me-2 text-primary"></i>Nuevo Producto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4 pt-0">
                        <hr class="text-muted mt-0 mb-4 opacity-10">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Categoría</label>
                            <select id="nuevoProdCategoria" class="form-select">
                                <option value="TOU">Tour (TOU)</option>
                                <option value="VUE">Boleto Aéreo (VUE)</option>
                                <option value="SEG">Seguro (SEG)</option>
                                <option value="PAQ">Paquete (PAQ)</option>
                                <option value="ALO">Alojamiento (ALO)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Descripción / Nombre</label>
                            <input type="text" class="form-control" id="nuevoProdDesc" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Precio Unitario ($)</label>
                            <input type="number" step="0.01" class="form-control" id="nuevoProdPrecio" required>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pb-4 px-4 pt-0 bg-white" style="border-radius: 0 0 var(--border-radius) var(--border-radius);">
                        <button type="button" class="btn btn-light fw-bold" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-factu fw-bold px-4" id="btnGuardarProducto"><i data-lucide="save" class="me-2" style="width: 16px;"></i> Guardar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Editar Producto -->
        <div class="modal fade" id="modalEditarProducto" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 shadow-lg" style="border-radius: var(--border-radius);">
                    <div class="modal-header border-0 bg-white" style="border-radius: var(--border-radius) var(--border-radius) 0 0;">
                        <h5 class="modal-title fw-bold text-dark d-flex align-items-center"><i data-lucide="edit" class="me-2 text-primary"></i>Editar Producto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4 pt-0">
                        <hr class="text-muted mt-0 mb-4 opacity-10">
                        <input type="hidden" id="editProdId">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Código</label>
                            <input type="text" class="form-control bg-light" id="editProdCodigo" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Descripción / Nombre</label>
                            <input type="text" class="form-control" id="editProdDesc" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Precio Unitario ($)</label>
                            <input type="number" step="0.01" class="form-control" id="editProdPrecio" required>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pb-4 px-4 pt-0 bg-white" style="border-radius: 0 0 var(--border-radius) var(--border-radius);">
                        <button type="button" class="btn btn-light fw-bold" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary fw-bold px-4" onclick="guardarEdicionProducto()"><i data-lucide="save" class="me-2" style="width: 16px;"></i> Actualizar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Eliminar Producto -->
        <div class="modal fade" id="modalEliminarProducto" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content border-0 shadow-lg" style="border-radius:16px;">
                    <div class="modal-body p-4 text-center">
                        <div style="font-size:2.5rem;">🗑️</div>
                        <h5 class="fw-bold text-dark mb-1 mt-2">¿Eliminar producto?</h5>
                        <p class="text-muted small mb-3">Se eliminará <strong><span id="elimProdNombre"></span></strong> permanentemente.</p>
                        <div class="d-flex gap-2">
                            <button class="btn btn-light fw-bold flex-grow-1" data-bs-dismiss="modal">Cancelar</button>
                            <button class="btn btn-primary fw-bold flex-grow-1" onclick="confirmarEliminarProducto()">Sí, eliminar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/components.js"></script>
    <script>Components.render('productos.html');</script>
    <script src="js/config.js"></script>
    <script src="js/models/ProductoModel.js"></script>
    <script src="js/controllers/productosController.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
