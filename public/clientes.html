<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACTU - Clientes</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"> 
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/auth-guard.js"></script>
</head>
<body>

    <div id="topbar-placeholder"></div>
    <div id="sidebar-placeholder"></div>
    <div id="a11y-placeholder"></div>

    <main class="main-content p-4 bg-light" style="min-height: 100vh;" role="main">
        <div class="page-header-wrap">
            <div>
                <h2 class="page-title"><i data-lucide="users" class="me-2 text-primary" aria-hidden="true"></i>Directorio de Clientes</h2>
                <p class="page-subtitle text-muted">Administra a tus clientes y agencias de viaje asociados.</p>
            </div>
            <div class="page-actions">
                <button class="btn btn-factu shadow-sm" onclick="abrirNuevoCliente()" aria-label="Registrar un nuevo cliente"><i data-lucide="plus" class="me-1" aria-hidden="true"></i> Nuevo Cliente</button>
            </div>
        </div>

        <div class="card shadow-sm border-0" style="border-radius: var(--border-radius);">
            <div class="card-header border-0 pt-4 pb-2 d-flex gap-2 align-items-center">
                <div class="input-group flex-grow-1">
                    <span class="input-group-text bg-light border-0"><i data-lucide="search" class="text-muted" aria-hidden="true"></i></span>
                    <input type="text" class="form-control bg-light border-0 shadow-none" id="clienteSearch" placeholder="Buscar por CI/RUC o nombre..." oninput="filtrarClientes()" aria-label="Buscar cliente">
                    <button class="btn btn-factu" onclick="filtrarClientes()" aria-label="Buscar"><i data-lucide="search" style="width:15px;"></i></button>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="bg-light text-muted" style="font-size:.78rem;letter-spacing:.4px;">
                            <tr>
                                <th class="ps-4">Cliente</th>
                                <th class="d-none d-md-table-cell">Identificación (RUC/CC)</th>
                                <th class="d-none d-lg-table-cell">Contacto</th>
                                <th class="d-none d-md-table-cell">Última Compra</th>
                                <th class="text-end pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="clientesTbody"></tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer border-top p-3 d-flex justify-content-between align-items-center">
                <span class="text-muted small" id="clientesContador">Mostrando 0 clientes</span>
                <div class="d-flex gap-1">
                    <button class="btn btn-sm btn-light border" id="cliPrev" onclick="cliPagina(-1)" aria-label="Página anterior de clientes">‹</button>
                    <span class="btn btn-sm btn-factu disabled px-3" id="cliPaginaNum">1</span>
                    <button class="btn btn-sm btn-light border" id="cliNext" onclick="cliPagina(1)" aria-label="Página siguiente de clientes">›</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal: Nuevo Cliente -->
    <div class="modal fade" id="modalNuevoCliente" tabindex="-1" aria-labelledby="modalNuevoClienteLbl" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: var(--border-radius);">
                <div class="modal-header border-0 bg-white" style="border-radius: var(--border-radius) var(--border-radius) 0 0;">
                    <h5 class="modal-title fw-bold text-dark d-flex align-items-center" id="modalNuevoClienteLbl">
                        <i data-lucide="user-plus" class="me-2 text-primary" aria-hidden="true"></i>Nuevo Cliente
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body p-4 pt-0">
                    <hr class="text-muted mt-0 mb-4 opacity-10">
                    <form id="formNuevoClienteCli">
                        <div class="row mb-3 g-2">
                            <div class="col-6">
                                <label class="form-label text-muted small fw-bold">Nombres</label>
                                <input type="text" class="form-control shadow-none border-1" id="cliNuevoNombre"
                                    oninput="this.value=this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑüÜ ]/g,'');" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted small fw-bold">Apellidos</label>
                                <input type="text" class="form-control shadow-none border-1" id="cliNuevoApellido"
                                    oninput="this.value=this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑüÜ ]/g,'');" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Cédula / RUC</label>
                            <input type="text" class="form-control shadow-none border-1" id="cliNuevoRuc"
                                inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'');" maxlength="13" required>
                        </div>
                        <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold">Dirección</label>
                                    <input type="text" class="form-control shadow-none border-1" id="modalDir" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Teléfono</label>
                            <div class="input-group">
                                <select class="form-select shadow-none border-1" id="cliNuevoTelPais" style="max-width:130px;">
                                    <option value="+593">🇪🇨 +593</option>
                                    <option value="+57">🇨🇴 +57</option>
                                </select>
                                <input type="tel" class="form-control shadow-none border-1" id="cliNuevoTel"
                                    inputmode="numeric" placeholder="999 999 9999" maxlength="10"
                                    oninput="this.value=this.value.replace(/[^0-9]/g,'');">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Correo Electrónico</label>
                            <input type="email" class="form-control shadow-none border-1" id="cliNuevoEmail">
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 pb-4 px-4 pt-0 bg-white" style="border-radius: 0 0 var(--border-radius) var(--border-radius);">
                    <button type="button" class="btn btn-light fw-bold" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-factu fw-bold px-4" onclick="guardarNuevoCliente()">
                        <i data-lucide="save" class="me-2" style="width:16px;"></i> Guardar y Agregar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Editar Cliente -->
    <div class="modal fade" id="modalEditarCliente" tabindex="-1" aria-labelledby="modalEditarClienteLbl" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: var(--border-radius);">
                <div class="modal-header border-0 bg-white" style="border-radius: var(--border-radius) var(--border-radius) 0 0;">
                    <h5 class="modal-title fw-bold text-dark d-flex align-items-center" id="modalEditarClienteLbl">
                        <i data-lucide="edit-3" class="me-2 text-primary" aria-hidden="true"></i> Editar Cliente
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body p-4 pt-0">
                    <hr class="text-muted mt-0 mb-4 opacity-10">
                    <input type="hidden" id="editCliIdx">
                    <form id="formEditarCliente">
                        <div class="row mb-3 g-2">
                            <div class="col-6">
                                <label class="form-label text-muted small fw-bold">Nombres</label>
                                <input type="text" class="form-control shadow-none border-1" id="editCliNombre"
                                    oninput="this.value=this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑüÜ ]/g,'');" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted small fw-bold">Apellidos</label>
                                <input type="text" class="form-control shadow-none border-1" id="editCliApellido"
                                    oninput="this.value=this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑüÜ ]/g,'');" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Cédula / RUC (Bloqueado)</label>
                            <input type="text" class="form-control fw-bold bg-light" id="editCliRuc" readonly>
                        </div>
                        <div class="mb-3">
                                    <label class="form-label text-muted small fw-bold">Dirección</label>
                                    <input type="text" class="form-control shadow-none border-1" id="modalDir" required>
                                </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Teléfono</label>
                            <div class="input-group">
                                <select class="form-select shadow-none border-1" id="editCliTelPais" style="max-width:130px;">
                                    <option value="+593">🇪🇨 +593</option>
                                    <option value="+57">🇨🇴 +57</option>
                                </select>
                                <input type="tel" class="form-control shadow-none border-1" id="editCliTel"
                                    inputmode="numeric" placeholder="999 999 9999" maxlength="10"
                                    oninput="this.value=this.value.replace(/[^0-9]/g,'');">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Correo Electrónico</label>
                            <input type="email" class="form-control shadow-none border-1" id="editCliEmail">
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 pb-4 px-4 pt-0 bg-white" style="border-radius: 0 0 var(--border-radius) var(--border-radius);">
                    <button type="button" class="btn btn-light fw-bold" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-factu fw-bold px-4" onclick="guardarEdicionCliente()">
                        <i data-lucide="save" class="me-2" style="width:16px;"></i> Guardar Cambios
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Confirmar Eliminar Cliente -->
    <div class="modal fade" id="modalEliminarCliente" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow-lg" style="border-radius: var(--border-radius);">
                <div class="modal-body p-4 text-center">
                    <div class="mb-3 text-danger" style="font-size:2.5rem;">🗑️</div>
                    <h5 class="fw-bold text-dark mb-1">¿Eliminar cliente?</h5>
                    <p class="text-muted small mb-3">Esta acción no se puede deshacer. El cliente <strong id="elimCliNombre"></strong> será eliminado permanentemente.</p>
                    <div class="d-flex gap-2">
                        <button class="btn btn-light fw-bold flex-grow-1" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn btn-danger fw-bold flex-grow-1" onclick="confirmarEliminarCliente()">Sí, eliminar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/components.js"></script>
    <script>Components.render('clientes.html');</script>
    <script src="js/models/clienteModel.js"></script>
    <script src="js/controllers/clientesController.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
