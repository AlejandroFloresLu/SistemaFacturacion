<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACTU - Carga Masiva</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"> 
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/auth-guard.js"></script>
</head>
<body>

    <div id="topbar-placeholder"></div>
    <div id="sidebar-placeholder"></div>
    <div id="a11y-placeholder"></div>

    <main class="main-content p-4 bg-light" style="min-height: 100vh;" role="main">
        <div class="page-header-wrap">
            <div>
                <h2 class="page-title"><i data-lucide="upload-cloud" class="me-2 text-primary" aria-hidden="true"></i>Carga Masiva de Datos</h2>
                <p class="page-subtitle text-muted">Importar múltiples productos o clientes mediante hoja de cálculo .xlsx o .csv.</p>
            </div>
        </div>
        <div class="row g-4 mt-2">
            <!-- Contenedor Productos -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0 h-100" style="border-radius: var(--border-radius);">
                    <div class="card-header bg-white border-0 pt-4 text-center">
                        <i data-lucide="package" class="text-primary mb-2" style="width: 32px; height: 32px;"></i>
                        <h5 class="fw-bold m-0">Productos</h5>
                    </div>
                    <div class="card-body text-center d-flex flex-column">
                        <button class="btn btn-light fw-bold text-primary mb-4 w-100 border hover-grow" onclick="descargarPlantilla('productos')"><i data-lucide="download-cloud" class="me-2" style="width: 18px;"></i> Descargar Plantilla</button>
                        <div id="dropZoneProd" class="flex-grow-1 border-2 rounded border-primary border-dashed p-4 d-flex flex-column justify-content-center align-items-center transition-all cursor-pointer" style="border-style: dashed; background-color: #f8fafc;" onclick="document.getElementById('fileProd').click()">
                            <input type="file" id="fileProd" class="d-none" accept=".csv, .xlsx" onchange="simularSubida(this, 'dropZoneProd', 'Productos')">
                            <i data-lucide="upload-cloud" style="width: 36px; height: 36px;" class="mb-2 text-primary opacity-50 d-block" aria-hidden="true"></i>
                            <span class="fw-bold small text-dark d-block">Soltar archivo aquí</span>
                            <span class="small text-muted mt-1 opacity-50">.XLSX o .CSV</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Contenedor Clientes -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0 h-100" style="border-radius: var(--border-radius);">
                    <div class="card-header bg-white border-0 pt-4 text-center">
                        <i data-lucide="users" class="text-primary mb-2" style="width: 32px; height: 32px;"></i>
                        <h5 class="fw-bold m-0">Clientes</h5>
                    </div>
                    <div class="card-body text-center d-flex flex-column">
                        <button class="btn btn-light fw-bold text-primary mb-4 w-100 border hover-grow" onclick="descargarPlantilla('clientes')"><i data-lucide="download-cloud" class="me-2" style="width: 18px;"></i> Descargar Plantilla</button>
                        <div id="dropZoneCli" class="flex-grow-1 border-2 rounded border-primary border-dashed p-4 d-flex flex-column justify-content-center align-items-center transition-all cursor-pointer" style="border-style: dashed; background-color: #f8fafc;" onclick="document.getElementById('fileCli').click()">
                            <input type="file" id="fileCli" class="d-none" accept=".csv, .xlsx" onchange="simularSubida(this, 'dropZoneCli', 'Clientes')">
                            <i data-lucide="upload-cloud" style="width: 36px; height: 36px;" class="mb-2 text-primary opacity-50 d-block" aria-hidden="true"></i>
                            <span class="fw-bold small text-dark d-block">Soltar archivo aquí</span>
                            <span class="small text-muted mt-1 opacity-50">.XLSX o .CSV</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Contenedor Facturas -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0 h-100" style="border-radius: var(--border-radius);">
                    <div class="card-header bg-white border-0 pt-4 text-center">
                        <i data-lucide="file-text" class="text-primary mb-2" style="width: 32px; height: 32px;"></i>
                        <h5 class="fw-bold m-0">Facturas</h5>
                    </div>
                    <div class="card-body text-center d-flex flex-column">
                        <button class="btn btn-light fw-bold text-primary mb-4 w-100 border hover-grow" onclick="descargarPlantilla('facturas')"><i data-lucide="download-cloud" class="me-2" style="width: 18px;"></i> Descargar Plantilla</button>
                        <div id="dropZoneFac" class="flex-grow-1 border-2 rounded border-primary border-dashed p-4 d-flex flex-column justify-content-center align-items-center transition-all cursor-pointer" style="border-style: dashed; background-color: #f8fafc;" onclick="document.getElementById('fileFac').click()">
                            <input type="file" id="fileFac" class="d-none" accept=".csv, .xlsx" onchange="simularSubida(this, 'dropZoneFac', 'Facturas')">
                            <i data-lucide="upload-cloud" style="width: 36px; height: 36px;" class="mb-2 text-primary opacity-50 d-block" aria-hidden="true"></i>
                            <span class="fw-bold small text-dark d-block">Soltar archivo aquí</span>
                            <span class="small text-muted mt-1 opacity-50">.XLSX o .CSV</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/components.js"></script>
    <script>Components.render('carga-masiva.html');</script>
    <script>
    lucide.createIcons();

    // ── Plantillas CSV para descarga ──
    const PLANTILLAS = {
        productos: "Codigo,Descripcion,Precio\nVUE-010,Boleto aereo ejemplo - Clase Economica,120.00\nALO-010,Habitacion hotel ejemplo - Estandar,60.00",
        clientes:  "Nombre,Apellido,RUC_Cedula,Telefono,Email\nJuan,Perez,1234567890,0999000111,juan@example.com",
        facturas:  "NumFactura,FechaEmision,RUC_Cliente,CodigoProducto,Cantidad\nFAC-000200,2026-08-01,1201201201,VUE-001,2"
    };

    function descargarPlantilla(tipo) {
        const csv = PLANTILLAS[tipo];
        if (!csv) return;
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = `plantilla_${tipo}.csv`;
        document.body.appendChild(a); a.click();
        a.remove(); URL.revokeObjectURL(url);
        mostrarToast(`📅 Plantilla de ${tipo} descargada`, 'info');
    }

    function simularSubida(input, dropId, nombre) {
        if (!input.files || !input.files[0]) return;
        const file = input.files[0];
        const zona = document.getElementById(dropId);

        // Muestra progress
        zona.innerHTML = `
            <div class="w-100">
                <div class="d-flex align-items-center mb-2">
                    <i data-lucide="file-check-2" style="width:20px;height:20px;" class="text-primary me-2"></i>
                    <span class="fw-bold small text-truncate" style="max-width:160px;">${file.name}</span>
                </div>
                <div class="progress" style="height:8px;border-radius:8px;">
                    <div id="prog_${dropId}" class="progress-bar bg-primary progress-bar-striped progress-bar-animated" style="width:0%"></div>
                </div>
                <div class="text-muted small mt-1" id="progLabel_${dropId}">Procesando...</div>
            </div>`;
        lucide.createIcons();

        // Simula progreso
        let pct = 0;
        const iv = setInterval(() => {
            pct = Math.min(pct + Math.random() * 25, 95);
            const bar = document.getElementById('prog_' + dropId);
            const lbl = document.getElementById('progLabel_' + dropId);
            if (bar) bar.style.width = pct + '%';
            if (lbl) lbl.textContent = `Procesando... ${Math.round(pct)}%`;
        }, 350);

        setTimeout(() => {
            clearInterval(iv);
            const bar = document.getElementById('prog_' + dropId);
            const lbl = document.getElementById('progLabel_' + dropId);
            if (bar) { bar.classList.remove('progress-bar-animated'); bar.style.width = '100%'; bar.classList.add('bg-success'); }
            if (lbl) lbl.textContent = '¡Archivo procesado correctamente!';
            mostrarToast(`✅ Carga de ${nombre} completada con éxito`, 'success');
            input.value = '';
            // Restaurar zona al cabo de 4s
            setTimeout(() => {
                zona.innerHTML = `
                    <i data-lucide="upload-cloud" style="width:36px;height:36px;" class="mb-2 text-primary opacity-50 d-block"></i>
                    <span class="fw-bold small text-dark d-block">Soltar archivo aquí</span>
                    <span class="small text-muted mt-1 opacity-50">.XLSX o .CSV</span>`;
                lucide.createIcons();
            }, 4000);
        }, 2200);
    }

    function mostrarToast(msg, tipo='success') {
        const t = document.createElement('div');
        t.className = `factu-toast ${tipo}`; t.innerHTML = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 4000);
    }
    </script>
</body>
</html>
