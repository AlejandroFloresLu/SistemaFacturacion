<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACTU - Carga Masiva</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"> 
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/auth-guard.js"></script>
</head>
<body>

    <div id="topbar-placeholder"></div>
    <div id="sidebar-placeholder"></div>
    <div id="a11y-placeholder"></div>

    <main class="main-content p-4 bg-light" style="min-height: 100vh;" role="main">
        <div class="page-header-wrap mb-4">
            <div>
                <h2 class="page-title"><i data-lucide="upload-cloud" class="me-2 text-primary" aria-hidden="true"></i>Carga Masiva de Datos</h2>
                <p class="page-subtitle text-muted">Importar múltiples productos, clientes o facturas mediante hoja de cálculo .csv.</p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0" style="border-radius: var(--border-radius);">
                    <div class="card-body p-4">
                        
                        <div class="mb-4">
                            <label for="entidadSelect" class="form-label fw-bold">Seleccionar Entidad</label>
                            <select id="entidadSelect" class="form-select">
                                <option value="clientes">Clientes</option>
                                <option value="productos">Productos</option>
                                <option value="facturas">Facturas</option>
                            </select>
                        </div>

                        <div class="mb-4 text-center">
                            <button id="btnDescargar" class="btn btn-outline-primary fw-bold w-100">
                                <i data-lucide="download-cloud" class="me-2" style="width: 18px;"></i> Descargar Plantilla Vacía
                            </button>
                        </div>

                        <div id="dropZone" class="border-2 rounded border-primary border-dashed p-5 d-flex flex-column justify-content-center align-items-center transition-all cursor-pointer" style="border-style: dashed; background-color: #f8fafc; min-height: 200px;">
                            <input type="file" id="fileInput" class="d-none" accept=".csv">
                            <i data-lucide="upload-cloud" style="width: 48px; height: 48px;" class="mb-3 text-primary opacity-50 d-block" aria-hidden="true"></i>
                            <span class="fw-bold text-dark d-block fs-5">Soltar archivo aquí</span>
                            <span class="small text-muted mt-2 opacity-75">Selecciona o arrastra tu archivo .CSV</span>
                        </div>
                        
                        <div id="uploadStatus" class="mt-3 d-none">
                            <div class="d-flex align-items-center mb-2">
                                <i data-lucide="file-check-2" style="width:20px;height:20px;" class="text-primary me-2"></i>
                                <span id="fileNameDisplay" class="fw-bold small text-truncate" style="max-width:200px;"></span>
                            </div>
                            <button id="btnSubir" class="btn btn-primary w-100 fw-bold mt-2">
                                <i data-lucide="upload" class="me-2" style="width: 18px;"></i> Subir Archivo
                            </button>
                        </div>

                        <!-- Zona de errores -->
                        <div id="errorZone" class="mt-4 d-none">
                            <div class="alert alert-danger" role="alert">
                                <h6 class="alert-heading fw-bold"><i data-lucide="alert-triangle" class="me-1" style="width:16px;"></i> Errores encontrados (Operación abortada)</h6>
                                <hr>
                                <ul id="errorList" class="mb-0 small ps-3"></ul>
                            </div>
                        </div>

                        <!-- Zona de exito -->
                        <div id="successZone" class="mt-4 d-none">
                            <div class="alert alert-success" role="alert">
                                <h6 class="alert-heading fw-bold"><i data-lucide="check-circle" class="me-1" style="width:16px;"></i> ¡Carga Exitosa!</h6>
                                <p id="successMessage" class="mb-0 small"></p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/main.js"></script>
    <script src="js/components.js"></script>
    <script>Components.render('carga-masiva.html');</script>
    <script src="js/config.js"></script>
    <script src="js/controllers/cargaMasivaController.js"></script>
</body>
</html>
